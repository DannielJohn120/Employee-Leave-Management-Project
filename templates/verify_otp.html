{% extends "base.html" %}
{% block content %}
<div class="auth-container">
  <div class="auth-box">
    <h2>Verify OTP</h2>
    <form method="POST">
      <label>Enter OTP</label>
      <input type="text" name="otp" placeholder="Enter OTP" required>
      <button type="submit">Verify</button>
    </form>
  </div>
</div>

<style>
  .auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 85vh;
    text-align: center;
  }

  .auth-box {
    background: rgba(0, 0, 0, 0.7);
    padding: 35px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
  }

  .auth-box h2 {
    color: #ff4444;
    margin-bottom: 20px;
  }

  .auth-box label {
    display: block;
    text-align: left;
    margin-bottom: 5px;
    color: #fff;
  }

  .auth-box input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: none;
    background: #333;
    color: #fff;
  }

  .auth-box button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background-color: #a51d2d;
    color: white;
    font-weight: bold;
    transition: background1 0.3s;
  }

  .auth-box button:hover {
    background-color: #d12e3d;
  }
</style>
{% endblock %}
