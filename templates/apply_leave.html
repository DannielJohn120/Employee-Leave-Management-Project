{% extends "base.html" %}

{% block content %}
<div class="apply-container">
  <div class="apply-box">
    <h2>Apply for Leave</h2>

    <form method="POST">
      <label for="start_date">Start Date</label>
      <input type="date" name="start_date" required>

      <label for="end_date">End Date</label>
      <input type="date" name="end_date" required>

      <label for="leave_type">Leave Type</label>
      <select name="leave_type" required>
        <option value="Vacation">Vacation</option>
        <option value="Sick">Sick</option>
        <option value="Emergency">Emergency</option>
        <option value="Unpaid">Unpaid</option>
      </select>

      <label for="reason">Reason</label>
      <textarea name="reason" rows="4" placeholder="Enter your reason here..." required></textarea>

      <button type="submit">Submit Leave Request</button>
    </form>

    <div class="back-link">
      <a href="{{ url_for('employee_dashboard') }}">← Back to Dashboard</a>
    </div>
  </div>
</div>

<style>
  .apply-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90vh;
    text-align: center;
  }

  .apply-box {
    background: rgba(0, 0, 0, 0.7);
    padding: 40px;
    border-radius: 12px;
    width: 420px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    color: white;
  }

  .apply-box h2 {
    color: #ff4444;
    margin-bottom: 25px;
  }

  form {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  label {
    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: bold;
    color: #fff;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: #333;
    color: #fff;
    margin-bottom: 12px;
  }

  button {
    background-color: #a51d2d;
    border: none;
    color: white;
    padding: 12px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
    margin-top: 10px;
    transition: background1 0.3s;
  }

  button:hover {
    background-color: #d12e3d;
  }

  .back-link {
    margin-top: 20px;
  }

  .back-link a {
    text-decoration: none;
    color: #ff4444;
    font-weight: bold;
    transition: color 0.3s;
  }

  .back-link a:hover {
    color: #d12e3d;
  }
</style>
{% endblock %}
